<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Archive — Shackelford Safety</title>
<!--
  Office-side archive browser. Deliberately a standalone page, NOT part of
  the field app:
    - the field app stays login-free, offline-first, localStorage-only, and
      is not touched by anything in this file
    - this page is the opposite: a desk tool that requires a login and a
      network, for looking up filed documents

  Access rules are enforced by Postgres row-level security, not by this
  page. A super sees only what they filed; safety/hr see everything. Nothing
  here can edit or delete a filed document -- the database has no UPDATE or
  DELETE policy at all, so append-only holds even if this page were
  tampered with.

  The publishable key below is meant to be public (that is what publishable
  means) -- it identifies the project, it does not grant access. RLS is what
  protects the data.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  :root{
    --navy:#0B1D2E; --crimson:#C51F3A; --crimson-2:#A71931;
    --bg:#F4F7FA; --card:#fff; --ink:#10233D; --ink-2:#43525F; --ink-3:#5C6B7A;
    --line:#D7E0EA; --border:#A9B6C4; --fill:#EEF3F8;
    --good:#1F6B4A; --good-tint:#E3F0E8;
    /* Five type sizes, each ~1.27x the last. Deliberately few and far
       apart: this is a desk tool people read for a while, and an earlier
       pass drifted into fourteen sizes with seven of them inside 3px of
       each other, which reads as mush rather than hierarchy. */
    --fs-micro:11px;  /* badges, role tag -- uppercase + tracked only */
    --fs-label:14px;  /* uppercase field labels, table headers, counts */
    --fs-body:18px;   /* everything you actually read: cells, values, inputs */
    --fs-head:23px;   /* bar title, panel title */
    --fs-title:30px;  /* the one page title */
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs-body)/1.5 'Barlow',ui-sans-serif,system-ui,sans-serif}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}

  /* login */
  .loginWrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--navy)}
  .loginCard{width:100%;max-width:420px;background:#fff;border-radius:12px;padding:28px;display:grid;gap:16px}
  .loginCard h1{margin:0;font:600 var(--fs-title)/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.01em}
  .loginCard p{margin:0;color:var(--ink-2);font-size:var(--fs-body)}
  label{display:grid;gap:6px;font:600 var(--fs-label) 'Barlow',sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
  input,select{width:100%;min-height:52px;padding:10px 13px;border:2px solid var(--border);border-radius:8px;font:400 var(--fs-body) 'Barlow',sans-serif;color:var(--ink);background:#fff;outline:none}
  input:focus,select:focus{border-color:var(--navy)}
  .primary{width:100%;min-height:56px;border:0;border-radius:8px;background:var(--crimson);color:#fff;font:600 var(--fs-head) 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase}
  .primary:hover{background:var(--crimson-2)}
  .primary:disabled{background:#C3CDD7}
  .err{background:#FBE8EB;border:2px solid #E8A9B4;color:#8F1229;border-radius:8px;padding:11px 13px;font-size:var(--fs-body)}
  .fine{font-size:var(--fs-label);color:var(--ink-3)}

  /* shell */
  header.bar{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header.bar h1{margin:0;font:600 var(--fs-head)/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.02em}
  .who{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:var(--fs-label);color:#B4C4D3}
  .roleTag{font:600 var(--fs-micro) 'Barlow',sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:5px;background:rgba(255,255,255,.15);color:#fff}
  .ghostBtn{min-height:40px;padding:0 14px;border:1px solid rgba(255,255,255,.35);border-radius:7px;background:transparent;color:#fff;font:600 var(--fs-label) 'Barlow',sans-serif}

  main{max-width:1180px;margin:0 auto;padding:20px}
  .scope{background:var(--good-tint);border:2px solid #9DC4AF;border-radius:8px;padding:11px 14px;font-size:var(--fs-body);margin-bottom:16px}
  .filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:18px}
  @media (max-width:820px){.filters{grid-template-columns:1fr 1fr}}
  @media (max-width:520px){.filters{grid-template-columns:1fr}}

  .count{font:600 var(--fs-label) 'Barlow',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(11,29,46,.06)}
  th{text-align:left;font:600 var(--fs-label) 'Barlow',sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);padding:12px 14px;background:var(--fill);border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:var(--fs-body);vertical-align:top}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#FAFCFE;cursor:pointer}
  .type{display:inline-block;font:600 var(--fs-micro) 'Barlow',sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:5px;background:var(--navy);color:#fff;white-space:nowrap}
  .empty{background:#fff;border:2px dashed var(--border);border-radius:10px;padding:40px 20px;text-align:center;color:var(--ink-2)}
  .tableWrap{overflow-x:auto}

  /* detail */
  .overlay{position:fixed;inset:0;background:rgba(11,29,46,.55);display:grid;place-items:end center;z-index:30}
  .panel{width:100%;max-width:820px;max-height:92vh;background:var(--bg);border-radius:12px 12px 0 0;display:flex;flex-direction:column;overflow:hidden}
  .panelHead{background:var(--navy);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
  .panelHead strong{font:600 var(--fs-head)/1 'Barlow Condensed',sans-serif;text-transform:uppercase}
  .panelBody{padding:20px;overflow-y:auto;display:grid;gap:14px}
  .kv{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .kv div{display:grid;grid-template-columns:minmax(160px,240px) 1fr;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .kv div:last-child{border-bottom:0}
  .kv dt,.kv .k{font:600 var(--fs-label) 'Barlow',sans-serif;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
  .kv .v{font-size:var(--fs-body);white-space:pre-wrap;word-break:break-word}
  .sectionTitle{font:600 var(--fs-label) 'Barlow',sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
</style>
</head>
<body>

<!-- ── login ── -->
<div class="loginWrap" id="login">
  <form class="loginCard" id="loginForm">
    <h1>Document Archive</h1>
    <p>Shackelford Construction &amp; Hauling — safety and employee records.</p>
    <label>Email<input type="email" id="email" autocomplete="username" required></label>
    <label>Password<input type="password" id="password" autocomplete="current-password" required></label>
    <div class="err hidden" id="loginErr"></div>
    <button class="primary" id="loginBtn" type="submit">Sign in</button>
    <p class="fine">This is the office side. The field app never asks anybody to sign in.</p>
  </form>
</div>

<!-- ── archive ── -->
<div class="hidden" id="app">
  <header class="bar">
    <h1>Document Archive</h1>
    <div class="who">
      <span id="whoEmail"></span>
      <span class="roleTag" id="whoRole"></span>
      <button class="ghostBtn" id="signOut">Sign out</button>
    </div>
  </header>
  <main>
    <div class="scope" id="scope"></div>
    <div class="filters">
      <input id="q" placeholder="Search employee or job site…" autocomplete="off">
      <select id="type">
        <option value="">All document types</option>
        <option value="jsa">Job Safety Analysis</option>
        <option value="incident">Incident Report</option>
        <option value="disciplinary">Disciplinary Action</option>
        <option value="separation">Employee Separation</option>
        <option value="medicalEvent">Medical Event</option>
        <option value="uncontrolledEvent">Uncontrolled Event</option>
      </select>
      <input id="from" type="date" title="From date">
      <input id="to" type="date" title="To date">
    </div>
    <div class="count" id="count"></div>
    <div class="tableWrap">
      <table id="table">
        <thead><tr>
          <th>Type</th><th>Employee</th><th>Job site</th><th>Document date</th><th>Filed</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty hidden" id="empty"></div>
  </main>
</div>

<div class="overlay hidden" id="overlay">
  <div class="panel">
    <div class="panelHead">
      <strong id="pTitle"></strong>
      <button class="ghostBtn" style="margin-left:auto" id="pDownload">Download</button>
      <button class="ghostBtn" id="pClose">Close</button>
    </div>
    <div class="panelBody" id="pBody"></div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://adqhuueugwbbudekpkiw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_E3BmuEKyuqoJFT2z9enHLA_fABj2RB_';
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const TYPES = {
  jsa:'JSA', incident:'Incident', disciplinary:'Disciplinary',
  separation:'Separation', medicalEvent:'Medical', uncontrolledEvent:'Uncontrolled'
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}) : '—';
const fmtWhen = t => t ? new Date(t).toLocaleString(undefined,{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}) : '—';

let profile = null;
let rows = [];

/* ── auth ── */
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('loginBtn'); const err = $('loginErr');
  btn.disabled = true; btn.textContent = 'Signing in…'; err.classList.add('hidden');
  const { error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  btn.disabled = false; btn.textContent = 'Sign in';
  if (error) { err.textContent = error.message; err.classList.remove('hidden'); return; }
  start();
});

$('signOut').addEventListener('click', async () => { await db.auth.signOut(); location.reload(); });

async function start() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) return;
  const { data: prof } = await db.from('profiles').select('full_name, role').eq('id', user.id).single();
  profile = prof || { role: 'field' };
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('whoEmail').textContent = profile.full_name || user.email;
  $('whoRole').textContent = profile.role;
  const seesAll = profile.role === 'safety' || profile.role === 'hr';
  $('scope').textContent = seesAll
    ? 'You can see every document filed by everybody.'
    : 'You can see the documents you filed. Safety and HR can see everything.';
  await load();
}

/* ── data ── */
async function load() {
  const { data, error } = await db.from('documents')
    .select('id, doc_type, employee_name, job_site, doc_date, submitted_at, data')
    .order('submitted_at', { ascending: false })
    .limit(500);
  if (error) { $('empty').textContent = 'Could not load: ' + error.message; $('empty').classList.remove('hidden'); return; }
  rows = data || [];
  draw();
}

function draw() {
  const q = $('q').value.trim().toLowerCase();
  const type = $('type').value;
  const from = $('from').value, to = $('to').value;
  const list = rows.filter(r => {
    if (type && r.doc_type !== type) return false;
    if (from && (!r.doc_date || r.doc_date < from)) return false;
    if (to && (!r.doc_date || r.doc_date > to)) return false;
    if (q) {
      const hay = ((r.employee_name || '') + ' ' + (r.job_site || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  $('count').textContent = `${list.length} document${list.length === 1 ? '' : 's'}`;
  $('rows').innerHTML = list.map(r => `
    <tr data-id="${r.id}">
      <td><span class="type">${esc(TYPES[r.doc_type] || r.doc_type)}</span></td>
      <td>${esc(r.employee_name || '—')}</td>
      <td>${esc(r.job_site || '—')}</td>
      <td>${esc(fmtDate(r.doc_date))}</td>
      <td>${esc(fmtWhen(r.submitted_at))}</td>
    </tr>`).join('');

  const noneAtAll = rows.length === 0;
  $('table').classList.toggle('hidden', list.length === 0);
  $('empty').classList.toggle('hidden', list.length !== 0);
  if (list.length === 0) {
    $('empty').textContent = noneAtAll
      ? 'Nothing filed yet. Documents show up here as they are submitted from the field app.'
      : 'Nothing matches those filters.';
  }
}

['q','type','from','to'].forEach(id => $(id).addEventListener('input', draw));

/* ── detail ── */
$('rows').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-id]');
  if (!tr) return;
  const row = rows.find(r => r.id === tr.dataset.id);
  if (row) openDoc(row);
});

function openDoc(row) {
  $('pTitle').textContent = (TYPES[row.doc_type] || row.doc_type) + ' — ' + (row.employee_name || row.job_site || 'Document');
  const meta = [
    ['Document type', TYPES[row.doc_type] || row.doc_type],
    ['Employee', row.employee_name || '—'],
    ['Job site', row.job_site || '—'],
    ['Document date', fmtDate(row.doc_date)],
    ['Filed', fmtWhen(row.submitted_at)],
  ];
  const fields = Object.entries(row.data || {})
    .filter(([, v]) => v !== null && v !== '' && !(Array.isArray(v) && v.length === 0))
    .map(([k, v]) => [
      k.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase()),
      Array.isArray(v) ? v.join('\n') : (typeof v === 'object' ? JSON.stringify(v, null, 2) : String(v))
    ]);

  $('pBody').innerHTML = `
    <div class="sectionTitle">Record</div>
    <div class="kv">${meta.map(([k, v]) => `<div><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('')}</div>
    <div class="sectionTitle">The document as it was filed</div>
    <div class="kv">${fields.length
      ? fields.map(([k, v]) => `<div><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('')
      : '<div><span class="v">No fields.</span></div>'}</div>`;

  $('pDownload').onclick = () => {
    const blob = new Blob([JSON.stringify(row, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${row.doc_type}_${(row.employee_name || row.job_site || 'document').replace(/[^a-z0-9]+/gi,'_')}_${row.doc_date || ''}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  $('overlay').classList.remove('hidden');
}
$('pClose').addEventListener('click', () => $('overlay').classList.add('hidden'));
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) $('overlay').classList.add('hidden'); });

/* already signed in? */
const { data: { session } } = await db.auth.getSession();
if (session) start();
</script>
</body>
</html>
